name: snappix_ai
description: "SnapPix-AI — AI Photo Upload with Face Detection and Auto-Tagging"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5

  # Camera & Photos
  image_picker: ^1.1.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  gap: ^3.0.1
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  # Icons
  cupertino_icons: ^1.0.8
  flutter_image_compress: ^2.4.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  google_mlkit_face_detection: ^0.13.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  image: ^4.9.1

  # Background services
  workmanager: ^0.10.7
  flutter_local_notifications: ^22.3.0
  flutter_background: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true